<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Three containers sharing one image's read-only layers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="395" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">Three containers from one image</text>

  <!-- containers -->
  <g>
    <rect x="45" y="58" width="150" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="120" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Container A</text>
    <text x="120" y="99" text-anchor="middle" font-size="11" fill="#6d28d9">own writable layer</text>
  </g>
  <g>
    <rect x="245" y="58" width="150" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="320" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Container B</text>
    <text x="320" y="99" text-anchor="middle" font-size="11" fill="#6d28d9">own writable layer</text>
  </g>
  <g>
    <rect x="445" y="58" width="150" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="520" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Container C</text>
    <text x="520" y="99" text-anchor="middle" font-size="11" fill="#6d28d9">own writable layer</text>
  </g>

  <!-- converging references -->
  <line x1="120" y1="110" x2="288" y2="216" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <line x1="320" y1="110" x2="320" y2="216" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <line x1="520" y1="110" x2="352" y2="216" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text x="398" y="167" text-anchor="start" font-size="11" font-style="italic" fill="#64748b">reference, not copy</text>

  <!-- shared image -->
  <text x="320" y="208" text-anchor="middle" font-size="12" fill="#334155">Shared image — read-only layers, stored once</text>
  <rect x="190" y="220" width="260" height="32" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#115e59">layer 3:  + app.py</text>
  <rect x="190" y="256" width="260" height="32" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="320" y="276" text-anchor="middle" font-size="13" fill="#115e59">layer 2:  + Python + deps</text>
  <rect x="190" y="292" width="260" height="32" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="320" y="312" text-anchor="middle" font-size="13" fill="#115e59">layer 1:  Ubuntu base</text>

  <!-- legend -->
  <rect x="110" y="344" width="13" height="13" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="130" y="354" font-size="11" fill="#334155">Per-container writable layer (private)</text>
  <rect x="110" y="366" width="13" height="13" rx="3" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="130" y="376" font-size="11" fill="#334155">Shared read-only image layer (one copy on disk)</text>
</svg>
